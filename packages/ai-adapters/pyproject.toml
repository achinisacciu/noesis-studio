[project]
name = "noesis-ai-adapters"
version = "0.1.0"
description = "Adapter comuni per runtime AI locali"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27", "noesis-contracts"]

[tool.uv.sources]
noesis-contracts = { path = "../contracts", editable = true }

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
