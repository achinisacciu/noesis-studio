[project]
name = "noesis-ai"
version = "0.1.0"
description = "AI Service: tutor con RAG citazionale e streaming"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "httpx>=0.27",
    "noesis-contracts",
    "noesis-ai-adapters",
]

[dependency-groups]
dev = ["pytest>=8", "httpx2", "ruff>=0.7", "mypy>=1.13"]

[tool.uv.sources]
noesis-contracts = { path = "../../packages/contracts", editable = true }
noesis-ai-adapters = { path = "../../packages/ai-adapters", editable = true }

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "../../packages/ai-adapters"
